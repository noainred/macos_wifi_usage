[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netusage"
version = "0.1.0"
description = "macOS Wi-Fi(SSID)/Ethernet 네트워크 사용량 모니터 및 리포트"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
netusage = "netusage.cli:main"

[tool.setuptools]
packages = ["netusage"]
